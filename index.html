<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>阿晏 · 地球online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 背景图与遮罩 -->
  <div class="bg-dream" id="bgDream"></div>
  <div class="bg-overlay"></div>

  <!-- 整体 App 容器 -->
  <div class="app-container w-full max-w-[430px] mx-auto relative">

    <!-- 顶部头部区域 -->
    <div class="px-5 pt-4 pb-1 flex-shrink-0">
      <div class="header-card flex flex-col items-center justify-center text-center" id="headerCard">
        <div class="glass-avatar p-0.5 w-12 h-12 flex items-center justify-center flex-shrink-0">
          <img id="avatarImg" src="https://picsum.photos/100/100?random=1" alt="头像" class="w-full h-full object-cover rounded-full border border-white/80">
        </div>
        <div class="flex flex-col items-center justify-center mt-1">
          <h1 class="text-lg font-bold text-[#333] leading-tight tracking-wide">阿晏</h1>
          <p class="text-[11px] text-[#5a6b7a] font-medium tracking-wide leading-tight">地球online</p>
        </div>
      </div>
    </div>

    <!-- 中间滚动内容区 -->
    <div class="main-content px-5">
      <!-- 搜索框 -->
      <div class="search-glass flex items-center px-4 py-2.5 gap-3 mt-1">
        <i class="fa-solid fa-magnifying-glass text-[#8899a6] text-sm"></i>
        <input type="text" placeholder="Search" class="flex-1 bg-transparent border-none outline-none text-[#333] text-sm placeholder-[#8899a6] font-normal tracking-wide">
      </div>

      <!-- 图片展示区 -->
      <div class="mt-3 flex justify-center">
        <div class="scroll-x flex gap-2.5 py-0.5 justify-center min-w-full">
          <div class="photo-scroll-item">
            <img id="photo1" src="https://picsum.photos/200/200?random=2" alt="展示图1" class="w-full h-full object-cover">
          </div>
          <div class="photo-scroll-item">
            <img id="photo2" src="https://picsum.photos/200/200?random=3" alt="展示图2" class="w-full h-full object-cover">
          </div>
          <div class="photo-scroll-item">
            <img id="photo3" src="https://picsum.photos/200/200?random=4" alt="展示图3" class="w-full h-full object-cover">
          </div>
        </div>
      </div>

      <!-- 音乐播放器 -->
      <div class="glass flex items-center gap-3 p-2.5 pr-3 mt-3">
        <div class="vinyl-cover w-12 h-12" id="vinylCover">
          <img id="albumCover" src="" alt="" class="vinyl-img" style="display:none;">
          <i id="albumIcon" class="fa-solid fa-music text-white/70 text-base"></i>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-[#333] font-semibold text-sm truncate" id="songTitle">My love</h4>
          <p class="text-[#8899a6] text-[10px] truncate mt-0.5" id="songArtist">颜人中</p>
        </div>
        <div class="flex items-center gap-1 flex-shrink-0">
          <button class="w-7 h-7 flex items-center justify-center text-[#555] active:opacity-60 transition" id="uploadBtn">
            <i class="fa-solid fa-arrow-up-from-bracket text-xs"></i>
          </button>
          <button class="w-7 h-7 flex items-center justify-center text-[#333] active:opacity-60 transition" id="prevBtn">
            <i class="fa-solid fa-backward-step text-sm"></i>
          </button>
          <button class="play-btn w-8 h-8 rounded-full flex items-center justify-center shadow-md active:scale-95 transition" id="playBtn">
            <i class="fa-solid fa-play text-xs pl-0.5" id="playIcon"></i>
          </button>
          <button class="w-7 h-7 flex items-center justify-center text-[#333] active:opacity-60 transition" id="nextBtn">
            <i class="fa-solid fa-forward-step text-sm"></i>
          </button>
        </div>
      </div>

      <audio id="audioPlayer" preload="metadata"></audio>

      <!-- 功能图标导航区 -->
      <div class="function-grid mt-4 mb-2">
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-house text-[#222] text-lg"></i></div>
          <span class="function-label">主页</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-cloud text-[#222] text-lg"></i></div>
          <span class="function-label">词云</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-regular fa-calendar-days text-[#222] text-lg"></i></div>
          <span class="function-label">重要日</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-book-open text-[#222] text-lg"></i></div>
          <span class="function-label">心晴手账</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-envelope text-[#222] text-lg"></i></div>
          <span class="function-label">信箱</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-users text-[#222] text-lg"></i></div>
          <span class="function-label">朋友圈</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-list-check text-[#222] text-lg"></i></div>
          <span class="function-label">梦向问卷</span>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="function-item">
          <div class="function-icon"><i class="fa-solid fa-gift text-[#222] text-lg"></i></div>
          <span class="function-label">心意集市</span>
        </a>
      </div>

      <div class="h-8"></div>
    </div>

    <!-- 底部 Tab 导航栏 -->
    <div class="fixed bottom-4 left-5 right-5 max-w-[430px] mx-auto z-50 pointer-events-none">
      <div class="bottom-tab flex items-center justify-around px-2 py-3 pointer-events-auto" id="bottomTabBar">
        <button class="tab-btn flex flex-col items-center justify-center w-full py-1 active" data-tab="message" id="tabMessage">
          <i class="fa-regular fa-comment-dots text-xl"></i>
          <span class="text-[10px] font-medium mt-1 tracking-wide">传讯</span>
        </button>
        <button class="tab-btn flex flex-col items-center justify-center w-full py-1" data-tab="card">
          <i class="fa-regular fa-clone text-xl"></i>
          <span class="text-[10px] font-medium mt-1 tracking-wide">字卡</span>
        </button>
        <button class="tab-btn flex flex-col items-center justify-center w-full py-1" data-tab="settings">
          <i class="fa-solid fa-gear text-xl"></i>
          <span class="text-[10px] font-medium mt-1 tracking-wide">设置</span>
        </button>
      </div>
    </div>

    <div class="h-0 w-full safe-bottom"></div>
  </div>

  <!-- 悬浮设置按钮 -->
  <button class="floating-settings" id="openSettings" title="自定义图片">
    <i class="fa-solid fa-palette text-lg"></i>
  </button>

  <!-- ============ 设置面板（图片自定义） ============ -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-panel">
      <div class="settings-title">
        <span><i class="fa-solid fa-image mr-2 text-[#55606b]"></i>自定义图片 / 音乐</span>
        <button class="settings-close" id="closeSettings">&times;</button>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-mountain-sun"></i>背景图</div>
        <input type="text" class="settings-input" id="inputBg" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="fileBg"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="fileBg" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="nameBg">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-user"></i>头像</div>
        <input type="text" class="settings-input" id="inputAvatar" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="fileAvatar"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="fileAvatar" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="nameAvatar">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-image"></i>展示图 1</div>
        <input type="text" class="settings-input" id="inputPhoto1" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="filePhoto1"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="filePhoto1" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="namePhoto1">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-image"></i>展示图 2</div>
        <input type="text" class="settings-input" id="inputPhoto2" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="filePhoto2"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="filePhoto2" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="namePhoto2">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-image"></i>展示图 3</div>
        <input type="text" class="settings-input" id="inputPhoto3" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="filePhoto3"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="filePhoto3" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="namePhoto3">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-music"></i>专辑封面</div>
        <input type="text" class="settings-input" id="inputAlbum" placeholder="粘贴图片 URL">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="fileAlbum"><i class="fa-solid fa-upload"></i>上传文件</label>
          <input type="file" id="fileAlbum" accept="image/*" style="display:none;">
          <span class="settings-file-name" id="nameAlbum">未选择文件</span>
        </div>
      </div>

      <div class="settings-row">
        <div class="settings-label"><i class="fa-solid fa-link"></i>自定义音乐 URL</div>
        <input type="text" class="settings-input" id="inputMusicUrl" placeholder="粘贴音频文件 URL（mp3 等）">
        <div class="settings-file-row">
          <label class="settings-file-btn" for="fileMusic"><i class="fa-solid fa-upload"></i>上传音乐</label>
          <input type="file" id="fileMusic" accept="audio/*" style="display:none;">
          <span class="settings-file-name" id="nameMusic">未选择文件</span>
        </div>
      </div>

      <div class="settings-actions">
        <button class="settings-btn btn-cancel" id="cancelSettings">取消</button>
        <button class="settings-btn btn-confirm" id="confirmSettings">应用</button>
      </div>
    </div>
  </div>

  <!-- ============ 歌曲列表底部弹窗 ============ -->
  <div class="playlist-sheet" id="playlistSheet">
    <div class="playlist-sheet-panel">
      <div class="playlist-sheet-header">
        <span class="playlist-sheet-deco">.°♫.°</span>
        <div class="playlist-sheet-actions">
          <button class="playlist-sheet-icon-btn" id="openManageBtn" title="歌单管理">
            <i class="fa-solid fa-folder-open"></i>
          </button>
          <button class="playlist-sheet-icon-btn" id="searchSongBtn" title="搜索">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <button class="playlist-sheet-icon-btn" id="openAddBtn" title="添加歌曲">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>
      <div class="playlist-scroll" id="playlistScroll"></div>
    </div>
  </div>

  <!-- ============ 添加自定义歌曲模态框 ============ -->
  <div class="add-modal" id="addModal">
    <div class="add-panel">
      <div class="add-title"><i class="fa-solid fa-music text-[#f8b4b4]"></i>添加自定义歌曲</div>
      <input type="text" class="add-input" id="addTitle" placeholder="歌曲名称（例如：这里的风景）">
      <input type="text" class="add-input" id="addArtist" placeholder="歌手 / 备注（例如：你的名字）">
      <input type="text" class="add-input" id="addUrl" placeholder="音频链接 (mp3/m4a 链接)">
      <div class="add-actions">
        <button class="add-btn add-btn-cancel" id="addCancel">取消</button>
        <button class="add-btn add-btn-confirm" id="addConfirm">添加播放</button>
      </div>
    </div>
  </div>

  <!-- ============ 歌单管理模态框 ============ -->
  <div class="manage-modal" id="manageModal">
    <div class="manage-panel">
      <div class="manage-title">歌单管理</div>
      <button class="manage-btn" id="importPlaylistBtn">
        <i class="fa-solid fa-file-import"></i>
        <span>导入歌单文件</span>
      </button>
      <input type="file" id="importFileInput" accept=".json,.txt,application/json" style="display:none;">
      <button class="manage-btn" id="exportPlaylistBtn">
        <i class="fa-solid fa-file-export"></i>
        <span>导出当前歌单</span>
      </button>
      <button class="manage-cancel" id="manageCancel">取消</button>
    </div>
  </div>

  <!-- ============ 传讯页面（全屏覆盖，默认隐藏） ============ -->
  <div class="message-app" id="messageApp">
    <!-- 顶栏 -->
    <div class="message-header">
      <button class="message-back-btn" id="messageBackBtn" title="返回">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="message-header-center">
        <img class="message-avatar" src="https://picsum.photos/200/200?random=99" alt="Ta">
        <div class="message-name">Ta</div>
        <div class="message-header-actions">
          <i class="fa-solid fa-phone" title="通话"></i>
          <i class="fa-solid fa-video" title="视频通话"></i>
        </div>
      </div>
      <div class="message-header-right"></div>
    </div>

    <!-- 消息展示区 -->
    <div class="message-body" id="messageBody">
      <div class="message-row other">
        <div class="message-bubble">你好呀，我是 Ta 👋</div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="message-input-bar">
      <div class="message-input-icons">
        <i class="fa-regular fa-image" title="图片"></i>
        <i class="fa-regular fa-face-smile" title="表情"></i>
      </div>
      <input type="text" class="message-input" id="messageInput" placeholder="输入消息...">
      <button class="message-send-btn" id="messageSendBtn" disabled>
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>

  <!-- 引入 JS -->
  <script src="js/main.js"></script>
  <script src="js/message.js"></script>
</body>
</html>
